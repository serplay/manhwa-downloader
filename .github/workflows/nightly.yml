name: Nightly sources

# Hits the real sites from a GitHub runner, which is a datacenter IP like the
# production host. A red cell here means a source changed its markup or its bot
# protection got stricter; it never blocks a merge.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  live-sources:
    name: live ${{ matrix.test }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test:
          - live_mangapill
          - live_mangahere
          - live_asurascans
          - live_weebcentral
          - live_ravenscans
          - live_toonily
          - live_browser_only_madara_sites
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo test -- --ignored --exact --nocapture sources::live_tests::${{ matrix.test }}

  live-download:
    name: live download (${{ matrix.source }}, ${{ matrix.format }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { source: mangapill, format: pdf }
          - { source: weebcentral, format: cbz }
          - { source: asurascans, format: epub }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: server
          load: true
          tags: manhwa-server:nightly
          cache-from: type=gha
      - run: docker run -d --name api -p 8000:8000 manhwa-server:nightly
      - name: Search, queue, download and verify one chapter
        env:
          SMOKE_LIVE: "1"
          SMOKE_SOURCE: ${{ matrix.source }}
          SMOKE_FORMAT: ${{ matrix.format }}
        run: server/scripts/smoke.sh http://localhost:8000
      - if: always()
        run: docker logs api
