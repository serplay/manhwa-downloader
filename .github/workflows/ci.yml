name: CI

on:
  push:
    branches: [master, rust-dev]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  image:
    runs-on: ubuntu-latest
    needs: server
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the server image
        uses: docker/build-push-action@v6
        with:
          context: server
          push: false
          load: true
          tags: manhwa-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the container
        run: docker run -d --name api -p 8000:8000 manhwa-server:ci
      - name: Smoke test the container
        run: server/scripts/smoke.sh http://localhost:8000
      - name: Container logs
        if: always()
        run: docker logs api

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
